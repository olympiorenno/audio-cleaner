<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23152"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Ondas de audio (atras do microfone) -->
  <path d="M 38 100 Q 50 75 62 100 Q 74 125 86 100" fill="none" stroke="#e94560" stroke-width="3" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M 24 100 Q 42 60 60 100 Q 78 140 96 100" fill="none" stroke="#e94560" stroke-width="2.5" stroke-opacity="0.2" stroke-linecap="round"/>

  <path d="M 162 100 Q 150 75 138 100 Q 126 125 114 100" fill="none" stroke="#e94560" stroke-width="3" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M 176 100 Q 158 60 140 100 Q 122 140 104 100" fill="none" stroke="#e94560" stroke-width="2.5" stroke-opacity="0.2" stroke-linecap="round"/>

  <!-- Corpo do microfone -->
  <rect x="82" y="48" width="36" height="68" rx="18" ry="18" fill="url(#mic)"/>

  <!-- Reflexo no microfone -->
  <rect x="88" y="54" width="10" height="30" rx="5" fill="white" fill-opacity="0.15"/>

  <!-- Suporte curvo do microfone -->
  <path d="M 68 108 Q 68 138 100 138 Q 132 138 132 108" fill="none" stroke="#e94560" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Haste vertical -->
  <line x1="100" y1="138" x2="100" y2="158" stroke="#e94560" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="80" y1="158" x2="120" y2="158" stroke="#e94560" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Linha de "corte" (simbolo de limpeza) -->
  <line x1="130" y1="55" x2="155" y2="80" stroke="#4ecca3" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="155" y1="55" x2="130" y2="80" stroke="#4ecca3" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
</svg>
